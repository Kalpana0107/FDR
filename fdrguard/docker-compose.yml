version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: fdr_guard_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fdrguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fdrguard_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-fdrguard}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fdrguard}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
